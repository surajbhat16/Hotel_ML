# Runs automatically before every commit. Install once with:  pre-commit install
# Then broken/unformatted code physically cannot be committed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: debug-statements        # blocks stray breakpoint() / pdb

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                    # lint
        args: [--fix]
      - id: ruff-format             # format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pandas-stubs, types-PyYAML]
        args: [--ignore-missing-imports]
