[project]
name = "hotel-ml"
version = "0.1.0"
description = "End-to-end ML platform for hotel-booking cancellation, demand, and pricing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24,<2.3",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "optuna>=3.4",
    "imbalanced-learn>=0.11",
    "mlflow>=2.9",
    "evidently>=0.4",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "prefect>=3.0",
]

[project.optional-dependencies]
explain = [
    "shap>=0.46",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces black, isort, flake8, pyupgrade, etc.)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["mlops"]

[tool.ruff.lint]
# A curated, senior-level rule set: pycodestyle, pyflakes, isort, bugbear,
# comprehensions, simplify, naming, pyupgrade, and pep8-naming.
select = ["E", "F", "I", "B", "C4", "SIM", "N", "UP", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true   # third-party libs without stubs (pandas etc.)
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false   # tests can be looser

# ---------------------------------------------------------------------------